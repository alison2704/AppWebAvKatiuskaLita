<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPN FIS - Chat WebSocket</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <!-- ===== HEADER ===== -->
        <header class="chat-header">
            <div class="header-left">
                <div class="chat-avatar">
                    <span class="avatar-icon">E</span>
                </div>
                <div class="header-info">
                    <h1 class="chat-title">Chat WebSocket</h1>
                    <div class="header-status">
                        <span class="status-dot" id="statusDot"></span>
                        <span class="status-text" id="statusText">Conectando...</span>
                        <span class="separator">|</span>
                        <span class="user-count">
                            <svg class="icon-users" viewBox="0 0 24 24" width="16" height="16">
                                <path fill="currentColor" d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                            </svg>
                            <span id="userCount">0</span> en linea
                        </span>
                    </div>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" title="Cambiar tema">
                    <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41.39.39 1.03.39 1.41 0l1.06-1.06z"/>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ===== LOGIN OVERLAY ===== -->
        <div class="login-overlay" id="loginOverlay">
            <div class="login-card">
                <div class="login-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path fill="currentColor" d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/>
                    </svg>
                </div>
                <h2 class="login-title">Bienvenido al Chat</h2>
                <p class="login-subtitle">Ingresa tu nombre para unirte</p>
                <input
                    type="text"
                    id="usernameInput"
                    class="login-input"
                    placeholder="Tu nombre..."
                    maxlength="20"
                    autocomplete="off"
                >
                <button id="joinBtn" class="login-btn">Unirse al chat</button>
                <p class="login-error" id="loginError"></p>
            </div>
        </div>

        <!-- ===== AREA DE MENSAJES ===== -->
        <main class="messages-area" id="messagesArea">
            <div class="messages-list" id="messagesList"></div>
            <!-- Indicador "escribiendo..." -->
            <div class="typing-indicator" id="typingIndicator" style="display: none;">
                <span class="typing-text" id="typingText"></span>
                <span class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </div>
        </main>

        <!-- ===== INPUT AREA ===== -->
        <footer class="input-area" id="inputArea">
            <input
                type="text"
                id="messageInput"
                class="message-input"
                placeholder="Escribe un mensaje..."
                maxlength="500"
                autocomplete="off"
                disabled
            >
            <button id="sendBtn" class="send-btn" disabled title="Enviar">
                <svg viewBox="0 0 24 24" width="24" height="24">
                    <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </footer>
    </div>

    <script src="chat.js"></script>
</body>
</html>
